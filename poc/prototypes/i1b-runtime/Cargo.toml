[workspace]
resolver = "2"

[package]
name = "poc-native-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
publish = false

[dependencies]
batch-services = { path = "../../crates/batch-services" }
poc-derivation = { path = "../../crates/derivation" }
l1-adapter = { path = "../../crates/l1-adapter" }
sim-espresso = { path = "../../crates/sim-espresso" }
poc-publisher = { path = "../../crates/publisher" }
poc-publication-bridge = { path = "../../crates/publication-bridge" }
poc-viewer-gfr = { path = "../../crates/viewer-gfr" }
poc-session-manager = { path = "../../crates/session-manager" }
poc-core = { path = "../../crates/core" }
poc-authorization = { path = "../../crates/authorization" }
poc-types = { path = "../../crates/types" }
commonware-runtime = { version = "=2026.10.0", features = ["controlled-spawn"] }
commonware-utils = "=2026.10.0"
commonware-cryptography = "=2026.10.0"
commonware-codec = "=2026.10.0"
commonware-consensus = { version = "=2026.10.0", features = ["native-recovery"] }
commonware-p2p = "=2026.10.0"
commonware-parallel = "=2026.10.0"
commonware-storage = "=2026.10.0"
commonware-actor = "=2026.10.0"
governor = "=0.10.4"
rand_core = "=0.10.1"
rand = "=0.10.3"
rand_chacha = "=0.10.0"
futures = "=0.3.34"
bytes = "=1.12.1"
tokio = { version = "=1.54.1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "process", "io-util", "io-std"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
tonic = "=0.14.9"
tonic-prost = "=0.14.9"
prost = "=0.14.4"
tokio-stream = { version = "=0.1.19", features = ["net"] }

[build-dependencies]
tonic-prost-build = "=0.14.9"
prost-build = "=0.14.4"
protoc-bin-vendored = "=3.3.0"

[patch.crates-io]
commonware-runtime = { path = "../../vendor/commonware-runtime" }
commonware-consensus = { path = "../../vendor/commonware-consensus" }

[profile.dev]
debug = "line-tables-only"

[profile.release]
overflow-checks = true

[[test]]
name = "i1b_runtime_independent"
path = "../../verification/i1b-runtime/acceptance.rs"

[[test]]
name = "native_storage_independent"
path = "../../verification/native-storage/acceptance.rs"

[[test]]
name = "native_witness_independent"
path = "../../verification/native-witness/acceptance.rs"

[[test]]
name = "native_engine_fresh_independent"
path = "../../verification/native-engine-fresh/acceptance.rs"

[[bin]]
name = "native-engine-verifier"
path = "../../verification/native-engine-fresh/crypto.rs"
