[workspace]
resolver = "2"

[package]
name = "poc-native-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
publish = false

[dependencies]
commonware-runtime = { version = "=2026.10.0", features = ["controlled-spawn"] }
commonware-utils = "=2026.10.0"
commonware-cryptography = "=2026.10.0"
commonware-codec = "=2026.10.0"
commonware-consensus = "=2026.10.0"
commonware-p2p = "=2026.10.0"
commonware-parallel = "=2026.10.0"
commonware-storage = "=2026.10.0"
commonware-actor = "=2026.10.0"
governor = "=0.10.4"
rand_core = "=0.10.1"
rand = "=0.10.3"
rand_chacha = "=0.10.0"
futures = "=0.3.34"
bytes = "=1.12.1"
tokio = { version = "=1.54.1", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"

[patch.crates-io]
commonware-runtime = { path = "../../vendor/commonware-runtime" }

[profile.dev]
debug = "line-tables-only"

[profile.release]
overflow-checks = true

[[test]]
name = "i1b_runtime_independent"
path = "../../verification/i1b-runtime/acceptance.rs"
