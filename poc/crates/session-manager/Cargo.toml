[package]
name = "poc-session-manager"
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
publish = false

[workspace]
resolver = "2"

[dependencies]
poc-types = { path = "../types" }
poc-core = { path = "../core" }
poc-viewer-gfr = { path = "../viewer-gfr" }

[dev-dependencies]
serde_json = "=1.0.154"

[profile.dev]
debug = "line-tables-only"

[profile.release]
overflow-checks = true
