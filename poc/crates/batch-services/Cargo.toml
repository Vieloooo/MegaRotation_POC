[package]
name = "batch-services"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace]

[dependencies]
l1-adapter = { path = "../l1-adapter" }
poc-types = { path = "../types" }
poc-core = { path = "../core" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha3 = "=0.11.0"
secp256k1 = { version = "=0.31.1", features = ["recovery"] }

[dev-dependencies]
libc = "=0.2.191"

[profile.dev]
debug = "line-tables-only"
