[package]
name = "poc-viewer-gfr"
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
publish = false

[workspace]
resolver = "2"

[dependencies]
poc-types = { path = "../types" }
poc-core = { path = "../core" }
poc-authorization = { path = "../authorization" }
sim-espresso = { path = "../sim-espresso" }

[profile.dev]
debug = "line-tables-only"

[profile.release]
overflow-checks = true

[dev-dependencies]
serde_json = "=1.0.154"
