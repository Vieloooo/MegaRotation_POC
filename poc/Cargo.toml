[workspace]
resolver = "2"
members = ["crates/types", "crates/sim-runtime", "crates/sim-hub", "crates/replica-worker", "crates/authorization", "crates/core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
publish = false

[workspace.dependencies]
poc-types = { path = "crates/types" }
poc-authorization = { path = "crates/authorization" }
poc-core = { path = "crates/core" }
commonware-codec = "=2026.10.0"
commonware-cryptography = "=2026.10.0"
commonware-utils = "=2026.10.0"
curve25519-dalek = "=5.0.0"
rand_chacha = "=0.10.0"
rand_core = "=0.10.1"
sim-runtime = { path = "crates/sim-runtime" }
tonic = "=0.14.9"
tonic-prost = "=0.14.9"
prost = "=0.14.4"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "sync", "net", "time", "process", "io-util"] }
tokio-stream = { version = "=0.1.19", features = ["net"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"

[profile.dev]
debug = "line-tables-only"

[profile.release]
overflow-checks = true
