<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="475" viewBox="0 0 1100 475" role="img" aria-labelledby="title desc"><title id="title">用证据跨过没有决定的 view</title><desc id="desc">view7认证链C，view8和9有跳过证书，view10可以提议合法扩展C接B。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#a4b4c2" stroke-width="1.4"/></marker></defs><rect width="1100" height="475" rx="18" fill="#ffffff"/><g font-family="PingFang SC, Noto Sans CJK SC, Arial Unicode MS, sans-serif"><text x="36" y="48" font-size="28" font-weight="600" text-anchor="start" fill="#153047">用证据跨过没有决定的 view</text><text x="36" y="84" font-size="21" font-weight="400" text-anchor="start" fill="#53697c">新提议携带已有 VC，以及它与当前 view 之间每一轮的 SC</text><rect x="36" y="130" width="220" height="143" rx="14" fill="#edf5fb" stroke="none"/><text x="56" y="166" font-size="24" font-weight="600" text-anchor="start" fill="#153047">view 7</text><text x="56" y="202" font-size="20" font-weight="400" text-anchor="start" fill="#53697c">VC₇(C)</text><text x="56" y="231" font-size="20" font-weight="400" text-anchor="start" fill="#53697c">认证链 C</text><rect x="306" y="130" width="220" height="143" rx="14" fill="#fff4e6" stroke="none"/><text x="326" y="166" font-size="24" font-weight="600" text-anchor="start" fill="#153047">view 8</text><text x="326" y="202" font-size="20" font-weight="400" text-anchor="start" fill="#53697c">SC₈</text><text x="326" y="231" font-size="20" font-weight="400" text-anchor="start" fill="#53697c">不可能存在 DC₈</text><rect x="576" y="130" width="220" height="143" rx="14" fill="#fff4e6" stroke="none"/><text x="596" y="166" font-size="24" font-weight="600" text-anchor="start" fill="#153047">view 9</text><text x="596" y="202" font-size="20" font-weight="400" text-anchor="start" fill="#53697c">SC₉</text><text x="596" y="231" font-size="20" font-weight="400" text-anchor="start" fill="#53697c">不可能存在 DC₉</text><rect x="846" y="130" width="220" height="143" rx="14" fill="#e9f6f2" stroke="none"/><text x="866" y="166" font-size="24" font-weight="600" text-anchor="start" fill="#153047">view 10</text><text x="866" y="202" font-size="20" font-weight="400" text-anchor="start" fill="#53697c">提议 C ∘ B</text><text x="866" y="231" font-size="20" font-weight="400" text-anchor="start" fill="#53697c">继续扩展链</text><path d="M264,202 L298,202" fill="none" stroke="#a4b4c2" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M534,202 L568,202" fill="none" stroke="#a4b4c2" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M804,202 L838,202" fill="none" stroke="#a4b4c2" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="36" y="313" width="1030" height="85" rx="14" fill="#edf5fb" stroke="none"/><text x="62" y="347" font-size="23" font-weight="600" text-anchor="start" fill="#153047">别人为什么敢投：</text><text x="62" y="380" font-size="22" font-weight="400" text-anchor="start" fill="#153047">中间没有可以被绕过的已决定结果；新块还须满足应用有效性检查。</text><text x="36" y="443" font-size="21" font-weight="400" text-anchor="start" fill="#53697c">view 是一次提议机会；跳过 view 8、9，不等于必须制造两个 L2 空块。</text></g></svg>