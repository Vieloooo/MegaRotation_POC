<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="525" viewBox="0 0 1100 525" role="img" aria-labelledby="title desc"><title id="title">为什么决定证书与跳过证书互斥</title><desc id="desc">两个五人集合在七人中至少重合三人，最多两个坏人，所以至少一个诚实人必须双签，这是不允许的。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#a4b4c2" stroke-width="1.4"/></marker></defs><rect width="1100" height="525" rx="18" fill="#ffffff"/><g font-family="PingFang SC, Noto Sans CJK SC, Arial Unicode MS, sans-serif"><text x="36" y="48" font-size="28" font-weight="600" text-anchor="start" fill="#153047">为什么决定证书与跳过证书互斥</text><text x="36" y="84" font-size="21" font-weight="400" text-anchor="start" fill="#53697c">7 个成员，最多 2 个 Byzantine；假设 DC 和 SC 各有 5 个签名人</text><text x="36" y="148" font-size="22" font-weight="600" text-anchor="start" fill="#153047">成员</text><text x="260" y="148" font-size="24" font-weight="600" text-anchor="middle" fill="#153047">A</text><text x="370" y="148" font-size="24" font-weight="600" text-anchor="middle" fill="#153047">B</text><text x="480" y="148" font-size="24" font-weight="600" text-anchor="middle" fill="#153047">C</text><text x="590" y="148" font-size="24" font-weight="600" text-anchor="middle" fill="#153047">D</text><text x="700" y="148" font-size="24" font-weight="600" text-anchor="middle" fill="#153047">E</text><text x="810" y="148" font-size="24" font-weight="600" text-anchor="middle" fill="#153047">F</text><text x="920" y="148" font-size="24" font-weight="600" text-anchor="middle" fill="#153047">G</text><text x="36" y="225" font-size="22" font-weight="500" text-anchor="start" fill="#153047">DC 的 Final</text><circle cx="260" cy="218" r="21" fill="#087f8c"/><text x="260" y="225" font-size="22" font-weight="600" text-anchor="middle" fill="#ffffff">✓</text><circle cx="370" cy="218" r="21" fill="#087f8c"/><text x="370" y="225" font-size="22" font-weight="600" text-anchor="middle" fill="#ffffff">✓</text><circle cx="480" cy="218" r="21" fill="#087f8c"/><text x="480" y="225" font-size="22" font-weight="600" text-anchor="middle" fill="#ffffff">✓</text><circle cx="590" cy="218" r="21" fill="#087f8c"/><text x="590" y="225" font-size="22" font-weight="600" text-anchor="middle" fill="#ffffff">✓</text><circle cx="700" cy="218" r="21" fill="#087f8c"/><text x="700" y="225" font-size="22" font-weight="600" text-anchor="middle" fill="#ffffff">✓</text><circle cx="810" cy="218" r="21" fill="#edf1f4"/><circle cx="920" cy="218" r="21" fill="#edf1f4"/><text x="36" y="302" font-size="22" font-weight="500" text-anchor="start" fill="#153047">SC 的 bottom</text><circle cx="260" cy="295" r="21" fill="#b66816"/><text x="260" y="302" font-size="22" font-weight="600" text-anchor="middle" fill="#ffffff">✓</text><circle cx="370" cy="295" r="21" fill="#b66816"/><text x="370" y="302" font-size="22" font-weight="600" text-anchor="middle" fill="#ffffff">✓</text><circle cx="480" cy="295" r="21" fill="#b66816"/><text x="480" y="302" font-size="22" font-weight="600" text-anchor="middle" fill="#ffffff">✓</text><circle cx="590" cy="295" r="21" fill="#edf1f4"/><circle cx="700" cy="295" r="21" fill="#edf1f4"/><circle cx="810" cy="295" r="21" fill="#b66816"/><text x="810" y="302" font-size="22" font-weight="600" text-anchor="middle" fill="#ffffff">✓</text><circle cx="920" cy="295" r="21" fill="#b66816"/><text x="920" y="302" font-size="22" font-weight="600" text-anchor="middle" fill="#ffffff">✓</text><rect x="220" y="166" width="300" height="163" rx="12" fill="none" stroke="#a4b4c2"/><text x="370" y="370" font-size="25" font-weight="600" text-anchor="middle" fill="#087f8c">交集至少 3 人</text><text x="370" y="405" font-size="23" font-weight="500" text-anchor="middle" fill="#153047">其中至少 1 人诚实</text><rect x="585" y="350" width="475" height="103" rx="14" fill="#fff4e6" stroke="none"/><text x="605" y="386" font-size="24" font-weight="600" text-anchor="start" fill="#153047">因此不能同时存在</text><text x="605" y="422" font-size="20" font-weight="400" text-anchor="start" fill="#53697c">诚实人不会在同一 view 签 Final 与 bottom</text><text x="36" y="493" font-size="22" font-weight="400" text-anchor="start" fill="#53697c">VC 与 SC 可以共存：第一阶段值票还不是最终承诺。</text></g></svg>