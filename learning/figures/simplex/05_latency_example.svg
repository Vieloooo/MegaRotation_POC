<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="585" viewBox="0 0 1100 585" role="img" aria-labelledby="title desc"><title id="title">减少保守等待比只数轮次更重要</title><desc id="desc">理想示例中当前同步方案区域证据110毫秒，标准Simplex15毫秒，Concurrent全员快路10毫秒。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#a4b4c2" stroke-width="1.4"/></marker></defs><rect width="1100" height="585" rx="18" fill="#ffffff"/><g font-family="PingFang SC, Noto Sans CJK SC, Arial Unicode MS, sans-serif"><text x="36" y="48" font-size="28" font-weight="600" text-anchor="start" fill="#153047">减少保守等待比只数轮次更重要</text><text x="36" y="84" font-size="21" font-weight="400" text-anchor="start" fill="#53697c">教学假设：δ = 5 ms，Δᵢ = 50 ms；同一提议起点，直接收齐区域证明</text><text x="36" y="174" font-size="24" font-weight="500" text-anchor="start" fill="#153047">当前 Sync HotStuff</text><text x="36" y="202" font-size="20" font-weight="400" text-anchor="start" fill="#53697c">2Δᵢ + 2δ</text><rect x="380" y="150" width="594.0" height="38" rx="4" fill="#2465a3" stroke="none"/><text x="986.0" y="177" font-size="23" font-weight="600" text-anchor="start" fill="#153047">110 ms</text><text x="36" y="270" font-size="24" font-weight="500" text-anchor="start" fill="#153047">标准 Simplex</text><text x="36" y="298" font-size="20" font-weight="400" text-anchor="start" fill="#53697c">3δ</text><rect x="380" y="246" width="81.0" height="38" rx="4" fill="#087f8c" stroke="none"/><text x="473.0" y="273" font-size="23" font-weight="600" text-anchor="start" fill="#153047">15 ms</text><text x="36" y="366" font-size="24" font-weight="500" text-anchor="start" fill="#153047">Concurrent 快路</text><text x="36" y="394" font-size="20" font-weight="400" text-anchor="start" fill="#53697c">2δ</text><rect x="380" y="342" width="54.0" height="38" rx="4" fill="#b66816" stroke="none"/><text x="446.0" y="369" font-size="23" font-weight="600" text-anchor="start" fill="#153047">10 ms</text><path d="M380.0,406 L380.0,413" fill="none" stroke="#a4b4c2" stroke-width="2.5"/><text x="380.0" y="438" font-size="18" font-weight="400" text-anchor="middle" fill="#53697c">0</text><path d="M488.0,406 L488.0,413" fill="none" stroke="#a4b4c2" stroke-width="2.5"/><text x="488.0" y="438" font-size="18" font-weight="400" text-anchor="middle" fill="#53697c">20</text><path d="M596.0,406 L596.0,413" fill="none" stroke="#a4b4c2" stroke-width="2.5"/><text x="596.0" y="438" font-size="18" font-weight="400" text-anchor="middle" fill="#53697c">40</text><path d="M704.0,406 L704.0,413" fill="none" stroke="#a4b4c2" stroke-width="2.5"/><text x="704.0" y="438" font-size="18" font-weight="400" text-anchor="middle" fill="#53697c">60</text><path d="M812.0,406 L812.0,413" fill="none" stroke="#a4b4c2" stroke-width="2.5"/><text x="812.0" y="438" font-size="18" font-weight="400" text-anchor="middle" fill="#53697c">80</text><path d="M920.0,406 L920.0,413" fill="none" stroke="#a4b4c2" stroke-width="2.5"/><text x="920.0" y="438" font-size="18" font-weight="400" text-anchor="middle" fill="#53697c">100</text><path d="M1028.0,406 L1028.0,413" fill="none" stroke="#a4b4c2" stroke-width="2.5"/><text x="1028.0" y="438" font-size="18" font-weight="400" text-anchor="middle" fill="#53697c">120</text><path d="M380,406 L1028.0,406" fill="none" stroke="#a4b4c2" stroke-width="2.5"/><text x="700" y="474" font-size="22" font-weight="400" text-anchor="middle" fill="#153047">区域最终证明形成时间（ms）</text><text x="36" y="521" font-size="20" font-weight="400" text-anchor="start" fill="#53697c">非实测；未含构块、执行、排队、外部依赖与后续客户端交付。</text><text x="36" y="553" font-size="20" font-weight="400" text-anchor="start" fill="#53697c">Concurrent 两轮依赖全员值票及时到齐；一人拒投时转由并行慢路完成。</text></g></svg>