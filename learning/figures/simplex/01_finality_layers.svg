<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="395" viewBox="0 0 1100 395" role="img" aria-labelledby="title desc"><title id="title">区域最终确认位于哪一层</title><desc id="desc">四个阶段从区域决定到批次结算，Simplex直接优化区域决定与区域证据形成。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#a4b4c2" stroke-width="1.4"/></marker></defs><rect width="1100" height="395" rx="18" fill="#ffffff"/><g font-family="PingFang SC, Noto Sans CJK SC, Arial Unicode MS, sans-serif"><text x="36" y="48" font-size="28" font-weight="600" text-anchor="start" fill="#153047">区域最终确认位于哪一层</text><text x="36" y="83" font-size="21" font-weight="400" text-anchor="start" fill="#53697c">先固定测量终点，才知道哪一种协议真的更快</text><rect x="36" y="122" width="230" height="140" rx="14" fill="#edf5fb" stroke="none"/><text x="56" y="158" font-size="24" font-weight="600" text-anchor="start" fill="#153047">区域本地决定</text><text x="56" y="194" font-size="20" font-weight="400" text-anchor="start" fill="#53697c">成员已决定 B</text><text x="56" y="223" font-size="20" font-weight="400" text-anchor="start" fill="#53697c">当前接口：Conf</text><rect x="306" y="122" width="230" height="140" rx="14" fill="#e9f6f2" stroke="none"/><text x="326" y="158" font-size="24" font-weight="600" text-anchor="start" fill="#153047">区域最终证据</text><text x="326" y="194" font-size="20" font-weight="400" text-anchor="start" fill="#53697c">观察者拿到可验证证明</text><text x="326" y="223" font-size="20" font-weight="400" text-anchor="start" fill="#53697c">新目标：完整 DC</text><rect x="576" y="122" width="230" height="140" rx="14" fill="#edf5fb" stroke="none"/><text x="596" y="158" font-size="24" font-weight="600" text-anchor="start" fill="#153047">进入全局链 G</text><text x="596" y="194" font-size="20" font-weight="400" text-anchor="start" fill="#53697c">Espresso + GFR 接纳</text><text x="596" y="223" font-size="20" font-weight="400" text-anchor="start" fill="#53697c">仍受系统恢复规则约束</text><rect x="846" y="122" width="220" height="140" rx="14" fill="#edf5fb" stroke="none"/><text x="866" y="158" font-size="24" font-weight="600" text-anchor="start" fill="#153047">派生与批次结算</text><text x="866" y="194" font-size="20" font-weight="400" text-anchor="start" fill="#53697c">DA、派生与 L1 流程</text><text x="866" y="223" font-size="20" font-weight="400" text-anchor="start" fill="#53697c">系统终局性另行判断</text><path d="M274,191 L299,191" fill="none" stroke="#a4b4c2" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M544,191 L569,191" fill="none" stroke="#a4b4c2" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M814,191 L839,191" fill="none" stroke="#a4b4c2" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="36" y="296" width="500" height="63" rx="14" fill="#e9f6f2" stroke="none"/><text x="286" y="337" font-size="24" font-weight="500" text-anchor="middle" fill="#087f8c">Simplex 直接优化的区域路径</text><text x="576" y="327" font-size="21" font-weight="400" text-anchor="start" fill="#53697c">区域 DC 不会自动完成后面的步骤</text></g></svg>