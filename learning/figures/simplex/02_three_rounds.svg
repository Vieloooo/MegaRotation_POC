<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="540" viewBox="0 0 1100 540" role="img" aria-labelledby="title desc"><title id="title">标准 Simplex 的三轮正常确认</title><desc id="desc">提议、值票和最终票分别耗时δ，2δ形成值证书，3δ形成决定证书。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#a4b4c2" stroke-width="1.4"/></marker></defs><rect width="1100" height="540" rx="18" fill="#ffffff"/><g font-family="PingFang SC, Noto Sans CJK SC, Arial Unicode MS, sans-serif"><text x="36" y="48" font-size="28" font-weight="600" text-anchor="start" fill="#153047">标准 Simplex 的三轮正常确认</text><text x="36" y="84" font-size="21" font-weight="400" text-anchor="start" fill="#53697c">标准 n = 3f + 1；从合法 proposal 发出起算；每跳近似 δ</text><path d="M82,124 L82,303" fill="none" stroke="#a4b4c2" stroke-width="2.5" stroke-dasharray="7 6"/><text x="82" y="117" font-size="24" font-weight="600" text-anchor="middle" fill="#153047">0</text><path d="M386,124 L386,303" fill="none" stroke="#a4b4c2" stroke-width="2.5" stroke-dasharray="7 6"/><text x="386" y="117" font-size="24" font-weight="600" text-anchor="middle" fill="#153047">δ</text><path d="M690,124 L690,303" fill="none" stroke="#a4b4c2" stroke-width="2.5" stroke-dasharray="7 6"/><text x="690" y="117" font-size="24" font-weight="600" text-anchor="middle" fill="#153047">2δ</text><path d="M1000,124 L1000,303" fill="none" stroke="#a4b4c2" stroke-width="2.5" stroke-dasharray="7 6"/><text x="1000" y="117" font-size="24" font-weight="600" text-anchor="middle" fill="#153047">3δ</text><rect x="90" y="155" width="275" height="42" rx="8" fill="#edf5fb" stroke="none"/><text x="234.0" y="183" font-size="21" font-weight="500" text-anchor="middle" fill="#153047">Proposal</text><path d="M88,203 L379,203" fill="none" stroke="#a4b4c2" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="394" y="212" width="275" height="42" rx="8" fill="#edf5fb" stroke="none"/><text x="538.0" y="240" font-size="21" font-weight="500" text-anchor="middle" fill="#153047">值票 Vote</text><path d="M392,260 L683,260" fill="none" stroke="#a4b4c2" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="698" y="269" width="275" height="42" rx="8" fill="#e9f6f2" stroke="none"/><text x="845.0" y="297" font-size="21" font-weight="500" text-anchor="middle" fill="#153047">最终票 Final</text><path d="M696,317 L993,317" fill="none" stroke="#a4b4c2" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="430" y="325" width="280" height="130" rx="14" fill="#edf5fb" stroke="none"/><text x="450" y="361" font-size="24" font-weight="600" text-anchor="start" fill="#153047">2δ：VC 已形成</text><text x="450" y="397" font-size="20" font-weight="400" text-anchor="start" fill="#53697c">可进入下一 view</text><text x="450" y="426" font-size="20" font-weight="400" text-anchor="start" fill="#53697c">尚未最终决定</text><rect x="760" y="325" width="305" height="130" rx="14" fill="#e9f6f2" stroke="none"/><text x="780" y="361" font-size="24" font-weight="600" text-anchor="start" fill="#153047">3δ：DC 已形成</text><text x="780" y="397" font-size="20" font-weight="400" text-anchor="start" fill="#53697c">B 与前缀已决定</text><text x="780" y="426" font-size="20" font-weight="400" text-anchor="start" fill="#53697c">可导出证明</text><text x="36" y="505" font-size="21" font-weight="400" text-anchor="start" fill="#53697c">下一 view 可以与旧 view 的最终票收集重叠；2δ 的推进时间 ≠ 3δ 的决定时间</text></g></svg>