<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="550" viewBox="0 0 1100 550" role="img" aria-labelledby="title desc"><title id="title">Concurrent 用全员快路争取两轮确认</title><desc id="desc">7票快路与5票加5最终票的慢路同时运行，快路不成时不必先等快路超时。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#a4b4c2" stroke-width="1.4"/></marker></defs><rect width="1100" height="550" rx="18" fill="#ffffff"/><g font-family="PingFang SC, Noto Sans CJK SC, Arial Unicode MS, sans-serif"><text x="36" y="48" font-size="28" font-weight="600" text-anchor="start" fill="#153047">Concurrent 用全员快路争取两轮确认</text><text x="36" y="84" font-size="21" font-weight="400" text-anchor="start" fill="#53697c">n = 7，f = 2，p = 0；从同一个 proposal 开始，同时走两条路</text><rect x="36" y="206" width="215" height="119" rx="14" fill="#edf5fb" stroke="none"/><text x="56" y="242" font-size="24" font-weight="600" text-anchor="start" fill="#153047">合法 proposal</text><text x="56" y="278" font-size="20" font-weight="400" text-anchor="start" fill="#53697c">检查块和证明</text><text x="56" y="307" font-size="20" font-weight="400" text-anchor="start" fill="#53697c">成员发值票</text><path d="M255,256 L302,256" fill="none" stroke="#a4b4c2" stroke-width="2.5"/><path d="M302,256 L302,171" fill="none" stroke="#a4b4c2" stroke-width="2.5"/><path d="M302,171 L358,171" fill="none" stroke="#a4b4c2" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M302,256 L302,355" fill="none" stroke="#a4b4c2" stroke-width="2.5"/><path d="M302,355 L358,355" fill="none" stroke="#a4b4c2" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="370" y="112" width="290" height="119" rx="14" fill="#e9f6f2" stroke="none"/><text x="390" y="148" font-size="24" font-weight="600" text-anchor="start" fill="#153047">快路收齐 7 张值票</text><text x="390" y="184" font-size="20" font-weight="400" text-anchor="start" fill="#53697c">无需等待 Final 阶段</text><text x="390" y="213" font-size="20" font-weight="400" text-anchor="start" fill="#53697c">理想决定时间：2δ</text><rect x="370" y="295" width="290" height="119" rx="14" fill="#edf5fb" stroke="none"/><text x="390" y="331" font-size="24" font-weight="600" text-anchor="start" fill="#153047">慢路先收 5 张值票</text><text x="390" y="367" font-size="20" font-weight="400" text-anchor="start" fill="#53697c">立即发送 Final</text><text x="390" y="396" font-size="20" font-weight="400" text-anchor="start" fill="#53697c">不等快路超时</text><path d="M666,171 L727,171" fill="none" stroke="#a4b4c2" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M666,355 L727,355" fill="none" stroke="#a4b4c2" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="740" y="112" width="325" height="119" rx="14" fill="#e9f6f2" stroke="none"/><text x="760" y="148" font-size="24" font-weight="600" text-anchor="start" fill="#153047">快路最终证据</text><text x="760" y="184" font-size="20" font-weight="400" text-anchor="start" fill="#53697c">全体响应时争取先完成</text><text x="760" y="213" font-size="20" font-weight="400" text-anchor="start" fill="#53697c">整体仍容忍 2 个故障</text><rect x="740" y="295" width="325" height="119" rx="14" fill="#edf5fb" stroke="none"/><text x="760" y="331" font-size="24" font-weight="600" text-anchor="start" fill="#153047">收齐 5 张 Final</text><text x="760" y="367" font-size="20" font-weight="400" text-anchor="start" fill="#53697c">慢路最终证据</text><text x="760" y="396" font-size="20" font-weight="400" text-anchor="start" fill="#53697c">理想决定时间：3δ</text><text x="36" y="476" font-size="21" font-weight="400" text-anchor="start" fill="#53697c">一个成员不投，快路可能失效；慢路仍能完成。安全容错 ≠ 两轮保证的故障数。</text><text x="36" y="514" font-size="20" font-weight="400" text-anchor="start" fill="#53697c">这里只画决定路径；完整协议还要处理快慢证书排序、跳过证据和 view 切换。</text></g></svg>